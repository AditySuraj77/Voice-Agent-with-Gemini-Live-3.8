<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Slate Canvas Gradient -->
    <linearGradient id="boardBg" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e1526" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Marker & Voice Pulse Wave Gradient -->
    <linearGradient id="pulseWave" x1="12" y1="48" x2="52" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="45%" stop-color="#fb923c" />
      <stop offset="85%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- AI Spark Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Whiteboard Canvas Base (Rounded Slate) -->
  <rect x="4" y="4" width="56" height="56" rx="15" fill="url(#boardBg)" stroke="#1e293b" stroke-width="1.8" />
  <rect x="5.5" y="5.5" width="53" height="53" rx="13.5" stroke="#334155" stroke-width="0.8" stroke-opacity="0.6" fill="none" />

  <!-- 2. Subtle Whiteboard Paper Grid Dots (Tactile Learning Feel) -->
  <circle cx="16" cy="20" r="1" fill="#334155" fill-opacity="0.7" />
  <circle cx="28" cy="20" r="1" fill="#334155" fill-opacity="0.7" />
  <circle cx="16" cy="32" r="1" fill="#334155" fill-opacity="0.7" />
  <circle cx="28" cy="32" r="1" fill="#334155" fill-opacity="0.7" />

  <!-- 3. Dynamic Voice Marker Wave (Drawn onto the board) -->
  <!-- Starts at marker point, pulses as audio wave, flows into horizon -->
  <path
    d="M 15 41 C 19 41, 21 47, 26 47 C 31 47, 32 27, 37 27 C 42 27, 43 38, 47 38 C 50 38, 52 33, 54 33"
    stroke="url(#pulseWave)"
    stroke-width="4.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 4. Whiteboard Marker / Pen Nib Indicator at the start of the stroke -->
  <path d="M 11 47 L 15 41 L 18 44 Z" fill="#f59e0b" />
  <circle cx="11.5" cy="46.5" r="1.8" fill="#fbbf24" />

  <!-- 5. Primary AI Spark (Gemini 4-Point Star) at upper right -->
  <path
    d="M 47 12 C 47 16.5, 44 19, 40 19 C 44 19, 47 21.5, 47 26 C 47 21.5, 50 19, 54 19 C 50 19, 47 16.5, 47 12 Z"
    fill="url(#sparkGrad)"
    filter="url(#softGlow)"
  />

  <!-- 6. Secondary Ambient Accent Dot -->
  <circle cx="36" cy="16" r="1.5" fill="#38bdf8" fill-opacity="0.9" />
</svg>
